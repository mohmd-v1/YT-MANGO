<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YT-DLP GUI</title>
  <script>
  /* Anti-flash (FOUC) bootstrap — mirrors applyShellTheme() in tabs.js */
  (function () {
    try {
      var cached = localStorage.getItem('theme-cache');
      if (cached === 'light' || cached === 'dark') {
        document.documentElement.setAttribute('data-theme', cached);
      } else if (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
      new MutationObserver(function () {
        try { localStorage.setItem('theme-cache', document.documentElement.getAttribute('data-theme')); } catch (e) { }
      }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
    } catch (e) { }
  })();
  </script>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/titlebar.css">
  <link rel="stylesheet" href="css/tabs.css">
</head>

<body class="tabs-shell">
  <header id="custom-titlebar" class="custom-titlebar">
    <div id="titlebar-drag-area"></div>

    <div class="browser-tabs-container" id="tabsList">
      <!-- Tabs will be dynamically inserted here -->
      <button class="new-tab-btn" id="newTabBtn" type="button" title="New Tab" aria-label="New Tab">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
    </div>

    <div class="window-controls">
      <button id="minimize-btn" class="window-btn" type="button" aria-label="Minimize">
        <svg viewBox="0 0 24 24">
          <path d="M5 12h14" />
        </svg>
      </button>
      <button id="maximize-btn" class="window-btn" type="button" aria-label="Maximize">
        <svg id="maximize-icon" viewBox="0 0 24 24">
          <rect x="5" y="5" width="14" height="14" rx="1" />
        </svg>
      </button>
      <button id="close-btn" class="window-btn close-btn" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24">
          <path d="M6 6l12 12M18 6L6 18" />
        </svg>
      </button>
    </div>
  </header>

  <div class="tab-iframes" id="tabIframes">
    <!-- Iframes will be dynamically inserted here -->
  </div>

  <script src="js/neutralino.js"></script>
  <script src="js/tabs.js"></script>
</body>

</html>
