<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YT-DLP GUI</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="titlebar.css">
  <link rel="stylesheet" href="tabs.css">
</head>

<body class="tabs-shell">
  <header id="custom-titlebar" class="custom-titlebar">
    <div id="titlebar-drag-area"></div>

    <div class="browser-tabs-container" id="tabsList">
      <!-- Tabs will be dynamically inserted here -->
      <button class="new-tab-btn" id="newTabBtn" title="New Tab">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
    </div>

    <div class="window-controls" style="z-index: 20;">
      <button id="minimize-btn" class="window-btn" type="button" aria-label="Minimize">
        <svg viewBox="0 0 24 24">
          <path d="M5 12h14" />
        </svg>
      </button>
      <button id="maximize-btn" class="window-btn" type="button" aria-label="Maximize">
        <svg id="maximize-icon" viewBox="0 0 24 24">
          <rect x="5" y="5" width="14" height="14" rx="1" />
        </svg>
      </button>
      <button id="close-btn" class="window-btn close-btn" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24">
          <path d="M6 6l12 12M18 6L6 18" />
        </svg>
      </button>
    </div>
  </header>

  <div class="tab-iframes" id="tabIframes">
    <!-- Iframes will be dynamically inserted here -->
  </div>

  <script src="js/neutralino.js"></script>
  <script src="js/tabs.js"></script>
</body>

</html>
